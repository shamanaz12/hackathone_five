services:
  # Backend FastAPI Service
  - type: web
    name: taskflow-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn production.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false # Set this in Render dashboard
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"

databases:
  - name: taskflow-db
    plan: free # Use free tier
