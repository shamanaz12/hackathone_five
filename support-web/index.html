<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Support</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-blue-100 py-12 px-4">
  <div class="max-w-2xl mx-auto">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-gray-900">TaskFlow Support</h1>
      <p class="text-gray-600 mt-2 text-lg">Get instant help from our AI agent</p>
    </div>

    <form id="supportForm" class="bg-white rounded-2xl shadow-xl p-8 space-y-5">
      <div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm"></div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Full Name</label>
        <input type="text" id="customer_name" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="John Doe">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
        <input type="email" id="email" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="john@example.com">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Subject</label>
        <input type="text" id="subject" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="Brief description of your issue">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Category</label>
          <select id="category" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-white">
            <option value="technical">Technical</option>
            <option value="billing">Billing</option>
            <option value="account">Account</option>
            <option value="feature">Feature Request</option>
            <option value="bug">Bug Report</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Priority</label>
          <select id="priority" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-white">
            <option value="P3">P3 - Normal</option>
            <option value="P1">P1 - Critical</option>
            <option value="P2">P2 - High</option>
            <option value="P4">P4 - Low</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Message</label>
        <textarea id="message" required rows="4" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition resize-none" placeholder="Describe your issue in detail..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white py-3 px-4 rounded-xl hover:bg-indigo-700 disabled:bg-indigo-400 disabled:cursor-not-allowed transition font-semibold flex items-center justify-center gap-2">
        Submit Ticket
      </button>
    </form>

    <div id="success" class="hidden bg-white rounded-2xl shadow-xl p-8 border border-green-200">
      <div class="text-center">
        <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-green-100 mb-4">
          <svg class="h-7 w-7 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Ticket Created!</h2>
        <p class="text-sm text-gray-500 mt-2">Ticket ID: <span id="ticketId" class="font-mono font-bold text-indigo-600"></span></p>
      </div>
      <div class="mt-6 bg-gray-50 rounded-xl p-5 border border-gray-200">
        <h3 class="text-sm font-semibold text-gray-700 mb-2 uppercase tracking-wide">AI Agent Response</h3>
        <p id="aiResponse" class="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap"></p>
      </div>
      <button onclick="resetForm()" class="mt-6 w-full bg-indigo-600 text-white py-3 px-4 rounded-xl hover:bg-indigo-700 transition font-semibold">Submit Another Ticket</button>
    </div>
  </div>

  <script>
    const form = document.getElementById('supportForm');
    const errorDiv = document.getElementById('error');
    const successDiv = document.getElementById('success');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processing...';

      try {
        const res = await fetch('http://localhost:8000/api/tickets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customer_name: document.getElementById('customer_name').value,
            email: document.getElementById('email').value,
            subject: document.getElementById('subject').value,
            category: document.getElementById('category').value,
            priority: document.getElementById('priority').value,
            message: document.getElementById('message').value,
          })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'Failed to submit ticket');
        }

        const data = await res.json();
        document.getElementById('ticketId').textContent = data.ticket_id;
        document.getElementById('aiResponse').textContent = data.ai_response;
        form.classList.add('hidden');
        successDiv.classList.remove('hidden');
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Submit Ticket';
      }
    });

    function resetForm() {
      form.reset();
      successDiv.classList.add('hidden');
      form.classList.remove('hidden');
    }
  </script>
</body>
</html>
