<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Support Form</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { color: #333; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #666; }
        input, textarea { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: #fff; border: none; padding: 1rem; width: 100%; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #0056b3; }
        #response { margin-top: 1.5rem; padding: 1rem; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Submit a Support Ticket</h1>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="John Doe">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="john@example.com">
        </div>
        <div class="form-group">
            <label>Subject</label>
            <input type="text" id="subject" placeholder="How do I...">
        </div>
        <div class="form-group">
            <label>Message</label>
            <textarea id="message" rows="4" placeholder="Describe your issue..."></textarea>
        </div>
        <button onclick="submitTicket()">Submit Ticket</button>
        <div id="response"></div>
    </div>

    <script>
        async function submitTicket() {
            const responseDiv = document.getElementById('response');
            const btn = document.querySelector('button');
            
            const payload = {
                customer_name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            };

            if (!payload.customer_name || !payload.email || !payload.message) {
                showResponse("Please fill in all required fields.", "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Submitting...";

            try {
                const res = await fetch('/api/tickets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                
                if (res.ok) {
                    showResponse(`<strong>Ticket Created: ${data.ticket_id}</strong><br><br>${data.ai_response.replace(/\n/g, '<br>')}`, "success");
                } else {
                    showResponse(data.detail || "Error creating ticket.", "error");
                }
            } catch (err) {
                showResponse("Network error. Is the server running?", "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Submit Ticket";
            }
        }

        function showResponse(msg, type) {
            const div = document.getElementById('response');
            div.innerHTML = msg;
            div.className = type;
            div.style.display = 'block';
        }
    </script>
</body>
</html>
